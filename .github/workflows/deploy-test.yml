# Deploys the exact commit that passed the "Test" workflow on main.
# Trigger: workflow_run (CI success on main push) or manual workflow_dispatch.
# Architecture: existing EC2 + PM2 + nginx (unchanged host paths / secrets).

name: Deploy Test Sahaya

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Optional git SHA to deploy (leave empty for origin/main)"
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only auto-deploy when CI passed for a push to main.
    # Manual workflow_dispatch always allowed (operator override).
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Resolve deploy SHA
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Deploying CI-verified commit from workflow_run"
          elif [ -n "${{ github.event.inputs.sha }}" ]; then
            SHA="${{ github.event.inputs.sha }}"
            echo "Deploying manually requested SHA"
          else
            SHA=""
            echo "Deploying origin/main (manual, no SHA override)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved DEPLOY_SHA=${SHA:-origin/main}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            MONOREPO="/var/www/apps/sahaya-final-aws-monorepo"
            PM2_NAME="sahaya-final-aws-monorepo-api"
            export MONOREPO PM2_NAME DEPLOY_SHA
            echo "========================"
            echo "Sahaya deploy starting"
            echo "DEPLOY_SHA=${DEPLOY_SHA:-origin/main}"
            echo "========================"
            cd "$MONOREPO"
            if [ ! -d .git ]; then echo "Monorepo missing at $MONOREPO" >&2; exit 1; fi
            echo "========================"
            echo "Pulling latest code (main)"
            echo "========================"
            git fetch origin
            git checkout main
            if [ -n "${DEPLOY_SHA:-}" ]; then git reset --hard "$DEPLOY_SHA"; else git reset --hard origin/main; fi
            echo "Deployed revision: $(git rev-parse HEAD)"
            git status
            echo "========================"
            echo "Running deploy-ec2.sh from checked-out revision"
            echo "========================"
            if [ ! -f backend/scripts/deploy-ec2.sh ]; then
              echo "FATAL: backend/scripts/deploy-ec2.sh missing at $(git rev-parse HEAD)" >&2
              echo "This deploy revision predates the external deploy script; push a commit that includes deploy-ec2.sh." >&2
              exit 1
            fi
            bash backend/scripts/deploy-ec2.sh
