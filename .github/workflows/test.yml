name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sahaya
          POSTGRES_PASSWORD: sahaya_test
          POSTGRES_DB: sahaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sahaya -d sahaya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sahaya:sahaya_test@localhost:5432/sahaya_test
      DB_MODE: prisma
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-at-least-32-chars-long
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
      PUBLIC_COMPLAINTS_ENABLED: "true"
      PUBLIC_OTP_ALLOW_SMS_SKIP: "true"
      PUBLIC_OTP_HMAC_SECRET: ci-test-otp-hmac-secret
      TENANT_CLIENTS_ENABLED: "true"
      SMS_TEST_MODE: "true"
      SMS_ENABLED: "false"
      PROCESS_ROLE: api
      SAHAYA_TEST_MODE: "1"
      PROVISION_SERVER_SIDE_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Prisma validate
        working-directory: backend
        run: npx prisma validate

      - name: Verify Prisma migration files
        working-directory: backend
        run: |
          set -euo pipefail
          for d in prisma/migrations/*/; do
            test -f "${d}migration.sql" || { echo "Missing migration.sql in $d"; exit 1; }
          done
          echo "All migration directories contain migration.sql"

      - name: Apply schema to test database
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Seed test data
        working-directory: backend
        run: npm run seed:test

      - name: Unit + repository tests (default vitest config)
        working-directory: backend
        run: npm test

      - name: Repository tests (isolated setup / teardown)
        working-directory: backend
        run: npm run test:repo

      - name: Integration tests
        working-directory: backend
        run: npm run test:integration

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Build-time API target for CI compile only (runtime FE uses EC2 frontend/.env).
          VITE_CRM_API_URL: https://api.test-sahaya.pariskq.in
          VITE_APP_BASE_URL: https://test-sahaya.pariskq.in
