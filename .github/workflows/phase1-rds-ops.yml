# TEST-only Phase 1 RDS operations via SSH to the TEST EC2.
# Manual trigger only — does NOT run on push.
# Never targets production hosts. Does not touch Supabase.

name: Phase 1 TEST RDS Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | provision | restore | cutover | rollback | smoke | s3_probe | s3_provision"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - provision
          - restore
          - cutover
          - rollback
          - smoke
          - schema_probe
          - prove_marker
          - s3_probe
          - s3_provision
      rds_identifier:
        description: "RDS instance id (TEST only)"
        required: false
        default: sahaya-test-postgres
      postgres_version:
        description: "RDS PostgreSQL engine version (must be available in region)"
        required: false
        default: "18"
      db_instance_class:
        description: "RDS instance class"
        required: false
        default: db.t4g.micro
      confirm:
        description: "Type CONFIRM for mutating modes (provision/restore/cutover/rollback/s3_provision)"
        required: false
        default: ""

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 TEST RDS op on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
          RDS_ID: ${{ inputs.rds_identifier }}
          PG_VERSION: ${{ inputs.postgres_version }}
          DB_CLASS: ${{ inputs.db_instance_class }}
          CONFIRM: ${{ inputs.confirm }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: MODE,RDS_ID,PG_VERSION,DB_CLASS,CONFIRM
          command_timeout: 45m
          script: |
            set -euo pipefail
            MODE="${MODE:-inspect}"
            RDS_ID="${RDS_ID:-sahaya-test-postgres}"
            PG_VERSION="${PG_VERSION:-18}"
            DB_CLASS="${DB_CLASS:-db.t4g.micro}"
            CONFIRM="${CONFIRM:-}"
            REGION="${AWS_REGION:-ap-south-1}"
            BACKUP_DIR="/var/backups/sahaya/pre-migration"
            DUMP_FILE="$BACKUP_DIR/sahaya-20260801-151400.dump"
            SCHEMA_FILE="$BACKUP_DIR/sahaya-schema-20260801-151400.sql"
            MONOREPO="/var/www/apps/sahaya-final-aws-monorepo"
            BACKEND_ENV="$MONOREPO/backend/.env"
            ROLLBACK_DIR="/var/backups/sahaya/phase1-rds"
            STATE_FILE="$ROLLBACK_DIR/cutover-state.env"
            PM2_NAME="sahaya-final-aws-monorepo-api"

            redact_db_url() {
              python3 - <<'PY'
            import os,re
            u=os.environ.get("RAW_URL","")
            # postgresql://user:pass@host:port/db?...
            m=re.match(r'^(?P<scheme>[^:]+://)(?P<user>[^:]+)(?::[^@]*)?@(?P<host>[^:/]+)(?::(?P<port>\d+))?/(?P<db>[^?]+)(?P<q>\?.*)?$', u or "")
            if not m:
                print("UNPARSEABLE")
            else:
                port=m.group("port") or "5432"
                print(f"{m.group('scheme')}{m.group('user')}:***@{m.group('host')}:{port}/{m.group('db')}{m.group('q') or ''}")
            PY
            }

            require_confirm() {
              if [ "$CONFIRM" != "CONFIRM" ]; then
                echo "Refusing mutating mode '$MODE' without confirm=CONFIRM"
                exit 2
              fi
            }

            echo "===== PHASE1 MODE=$MODE REGION=$REGION RDS_ID=$RDS_ID ====="
            echo "Host=$(hostname) User=$(whoami) Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if [ "$MODE" = "inspect" ]; then
              echo "===== Self EC2 metadata (no AWS CLI required) ====="
              TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
              IID=""; MAC=""; VPC=""; SUBNET=""; SGS=""; AZ=""; IAM_INFO=""; DOC=""
              if [ -n "$TOKEN" ]; then
                IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id || true)
                MAC=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/network/interfaces/macs/ | head -1 | tr -d '/')
                VPC=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${MAC}/vpc-id" || true)
                SUBNET=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${MAC}/subnet-id" || true)
                SGS=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${MAC}/security-group-ids" || true)
                AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone || true)
                IAM_INFO=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/info || true)
                echo "instance_id=$IID az=$AZ vpc=$VPC subnet=$SUBNET sgs=$SGS"
                echo "iam_info=$IAM_INFO"
              else
                echo "IMDSv2 token unavailable"
              fi

              echo "===== Ensure AWS CLI on TEST EC2 (install if missing) ====="
              if ! command -v aws >/dev/null 2>&1; then
                if command -v apt-get >/dev/null 2>&1; then
                  sudo apt-get update -y >/tmp/awscli-apt.log 2>&1 || true
                  sudo apt-get install -y awscli >/tmp/awscli-install.log 2>&1 || true
                fi
                if ! command -v aws >/dev/null 2>&1; then
                  curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                  sudo apt-get install -y unzip >/dev/null 2>&1 || true
                  unzip -qo /tmp/awscliv2.zip -d /tmp
                  sudo /tmp/aws/install -i /usr/local/aws-cli -b /usr/local/bin 2>&1 | tail -5 || true
                fi
              fi
              command -v aws || echo "aws CLI still missing"

              echo "===== AWS identity (instance/role/credentials on EC2) ====="
              if command -v aws >/dev/null 2>&1; then
                aws sts get-caller-identity --output json || echo "sts FAILED"
                echo "===== RDS instances (safe ids) ====="
                aws rds describe-db-instances --region "$REGION" \
                  --query 'DBInstances[].{id:DBInstanceIdentifier,engine:Engine,ver:EngineVersion,status:DBInstanceStatus,endpoint:Endpoint.Address,port:Endpoint.Port,public:PubliclyAccessible,vpc:DBSubnetGroup.VpcId,class:DBInstanceClass}' \
                  --output table 2>&1 || echo "rds:DescribeDBInstances FAILED"
                echo "===== PostgreSQL engine versions (16/17/18) ====="
                aws rds describe-db-engine-versions --region "$REGION" --engine postgres \
                  --query 'DBEngineVersions[?starts_with(EngineVersion, `16`) || starts_with(EngineVersion, `17`) || starts_with(EngineVersion, `18`)].EngineVersion' \
                  --output text 2>&1 || echo "rds:DescribeDBEngineVersions FAILED"
                if [ -n "$IID" ]; then
                  aws ec2 describe-instances --region "$REGION" --instance-ids "$IID" \
                    --query 'Reservations[0].Instances[0].{SubnetId:SubnetId,VpcId:VpcId,SGs:SecurityGroups,PrivateIp:PrivateIpAddress,PublicIp:PublicIpAddress,IamProfile:IamInstanceProfile.Arn}' \
                    --output json 2>&1 || echo "ec2:DescribeInstances FAILED"
                fi
                echo "===== Subnets in VPC (for DB subnet group) ====="
                if [ -n "$VPC" ]; then
                  aws ec2 describe-subnets --region "$REGION" --filters "Name=vpc-id,Values=$VPC" \
                    --query 'Subnets[].{id:SubnetId,az:AvailabilityZone,public:MapPublicIpOnLaunch,cidr:CidrBlock}' \
                    --output table 2>&1 || echo "ec2:DescribeSubnets FAILED"
                fi
              else
                echo "aws CLI not available after install attempt"
              fi

              echo "===== Docker migration DB ====="
              docker ps --filter name=sahaya-migration-db --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
              echo "===== Backup artifacts ====="
              ls -lah "$BACKUP_DIR" 2>&1 || true
              if [ -f "$DUMP_FILE" ]; then
                sha256sum "$DUMP_FILE" | awk '{print "dump_sha256="$1}'
              fi
              echo "===== Current DATABASE_URL (redacted) ====="
              if [ -f "$BACKEND_ENV" ]; then
                RAW_URL=$(grep -E '^DATABASE_URL=' "$BACKEND_ENV" | head -1 | cut -d= -f2- | sed 's/^"//;s/"$//')
                export RAW_URL
                echo -n "DATABASE_URL="
                redact_db_url
                grep -E '^(SHARED_SUPABASE_MUTATIONS_DISABLED|AWS_REGION|S3_FE_PROOFS)=' "$BACKEND_ENV" || true
              else
                echo "backend .env missing"
              fi
              echo "===== PM2 ====="
              pm2 describe "$PM2_NAME" 2>&1 | head -40 || true
              echo "===== Tools ====="
              command -v psql || echo "psql missing"
              command -v pg_restore || echo "pg_restore missing"
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -tAc "SELECT version();" 2>&1 | head -2 || true
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -tAc "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE') AS tables, (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM organisations) AS organisations, (SELECT count(*) FROM tickets) AS tickets;" 2>&1 || true
              echo "===== INSPECT COMPLETE ====="
              exit 0
            fi



            if [ "$MODE" = "prove_marker" ]; then
              echo "===== latest PHASE_A markers in audit_logs ====="
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -c "SELECT id, action, created_at FROM audit_logs WHERE action LIKE 'PHASE_A_VALIDATION_%' ORDER BY created_at DESC LIMIT 5;"
              echo "===== S3 flag / freeze / db_mode ====="
              grep -E '^(S3_FE_PROOFS_ENABLED|SHARED_SUPABASE_MUTATIONS_DISABLED|DB_MODE|PHASE_A_DB_PROBE_ENABLED|DATABASE_URL)=' /var/www/apps/sahaya-final-aws-monorepo/backend/.env | sed -E 's/(DATABASE_URL=).+/\1***localhost***/'
              echo "===== backend supabase.from count in deployed tree ====="
              grep -R "supabase\.from\|supabaseAuth\.from\|\.rpc(" /var/www/apps/sahaya-final-aws-monorepo/backend/src --include='*.js' | wc -l
              exit 0
            fi

            if [ "$MODE" = "schema_probe" ]; then
              echo "===== audit_logs columns ====="
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -c "\d+ audit_logs" 2>&1 | head -80
              echo "===== tickets columns (sample) ====="
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -tAc "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='audit_logs' ORDER BY ordinal_position;"
              echo "===== users columns ====="
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -tAc "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='users' ORDER BY ordinal_position;"
              echo "===== ticket_number_sequences ====="
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -tAc "SELECT count(*) FROM ticket_number_sequences;" 2>&1 || echo missing_table
              echo "===== baseline counts ====="
              docker exec sahaya-migration-db psql -U sahaya -d sahaya -tAc "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'), (SELECT count(*) FROM users), (SELECT count(*) FROM organisations), (SELECT count(*) FROM tickets);"
              exit 0
            fi

            if [ "$MODE" = "s3_probe" ] || [ "$MODE" = "s3_provision" ]; then
              TARGET_BUCKET="sahaya-test-fe-proofs"
              FORBIDDEN_BUCKET="crm-pariskq"
              echo "===== PHASE C S3 CAPABILITY ($MODE) ====="
              echo "target_bucket=$TARGET_BUCKET forbidden_bucket=$FORBIDDEN_BUCKET region=$REGION"
              if [ ! -f "$BACKEND_ENV" ]; then
                echo "backend .env missing"
                exit 2
              fi
              grep -E '^(AWS_REGION|S3_FE_PROOFS_ENABLED|S3_FE_PROOFS_BUCKET|SHARED_SUPABASE_MUTATIONS_DISABLED)=' "$BACKEND_ENV" || true
              echo -n "HAS_AWS_ACCESS_KEY_ID="; grep -q '^AWS_ACCESS_KEY_ID=.' "$BACKEND_ENV" && echo yes || echo no
              echo -n "HAS_AWS_SECRET_ACCESS_KEY="; grep -q '^AWS_SECRET_ACCESS_KEY=.' "$BACKEND_ENV" && echo yes || echo no
              echo -n "HAS_AWS_SESSION_TOKEN="; grep -q '^AWS_SESSION_TOKEN=.' "$BACKEND_ENV" && echo yes || echo no
              TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
              if [ -n "$TOKEN" ]; then
                CODE=$(curl -s -o /tmp/iaminfo.txt -w '%{http_code}' -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/info || true)
                echo "IMDS_IAM_INFO_HTTP=$CODE"
              fi
              cd "$MONOREPO/backend"
              export PHASE_C_MODE="$MODE"
              export PHASE_C_CONFIRM="$CONFIRM"
              export PHASE_C_TARGET_BUCKET="$TARGET_BUCKET"
              export PHASE_C_FORBIDDEN_BUCKET="$FORBIDDEN_BUCKET"
              node --input-type=module <<'NODE'
            import dotenv from 'dotenv';
            import {
              S3Client,
              HeadBucketCommand,
              CreateBucketCommand,
              PutBucketEncryptionCommand,
              PutPublicAccessBlockCommand,
              PutObjectCommand,
              GetObjectCommand,
              DeleteObjectCommand,
            } from '@aws-sdk/client-s3';

            dotenv.config({ path: '.env' });
            const region = String(process.env.AWS_REGION || 'ap-south-1').trim();
            const target = String(process.env.PHASE_C_TARGET_BUCKET || 'sahaya-test-fe-proofs').trim();
            const forbidden = String(process.env.PHASE_C_FORBIDDEN_BUCKET || 'crm-pariskq').trim();
            const mode = String(process.env.PHASE_C_MODE || 's3_probe');
            const confirm = String(process.env.PHASE_C_CONFIRM || '');
            const configured = String(process.env.S3_FE_PROOFS_BUCKET || '').trim();

            console.log(JSON.stringify({
              region,
              configuredBucket: configured || null,
              enabled: process.env.S3_FE_PROOFS_ENABLED || null,
              hasAccessKey: Boolean(process.env.AWS_ACCESS_KEY_ID),
              hasSecret: Boolean(process.env.AWS_SECRET_ACCESS_KEY),
              configuredIsForbidden: configured === forbidden,
              target,
            }));

            if (configured === forbidden) {
              console.log(JSON.stringify({ warning: 'configured_bucket_is_forbidden_crm_pariskq' }));
            }

            const client = new S3Client({ region });
            async function head(name) {
              try {
                await client.send(new HeadBucketCommand({ Bucket: name }));
                return { name, exists: true, error: null };
              } catch (e) {
                return { name, exists: false, error: e?.name || e?.Code || e?.message || String(e) };
              }
            }

            const headTarget = await head(target);
            const headForbidden = await head(forbidden);
            console.log(JSON.stringify({ headTarget, headForbiddenExistsOnly: headForbidden }));

            if (mode !== 's3_provision') {
              console.log(JSON.stringify({ createSkipped: true, reason: 'probe_only' }));
              process.exit(0);
            }
            if (confirm !== 'CONFIRM') {
              console.log(JSON.stringify({ createSkipped: true, reason: 'need_confirm_CONFIRM' }));
              process.exit(2);
            }
            if (target === forbidden) {
              console.log(JSON.stringify({ refused: true, reason: 'refuses_forbidden_bucket' }));
              process.exit(3);
            }

            if (!headTarget.exists) {
              try {
                const cfg = region === 'us-east-1' ? {} : { CreateBucketConfiguration: { LocationConstraint: region } };
                await client.send(new CreateBucketCommand({ Bucket: target, ...cfg }));
                console.log(JSON.stringify({ created: true, bucket: target }));
              } catch (e) {
                console.log(JSON.stringify({ created: false, error: e?.name || e?.message }));
                process.exit(4);
              }
            } else {
              console.log(JSON.stringify({ created: false, alreadyExists: true, bucket: target }));
            }

            try {
              await client.send(new PutPublicAccessBlockCommand({
                Bucket: target,
                PublicAccessBlockConfiguration: {
                  BlockPublicAcls: true,
                  IgnorePublicAcls: true,
                  BlockPublicPolicy: true,
                  RestrictPublicBuckets: true,
                },
              }));
              console.log(JSON.stringify({ publicAccessBlock: 'applied' }));
            } catch (e) {
              console.log(JSON.stringify({ publicAccessBlock: 'failed', error: e?.name || e?.message }));
            }

            try {
              await client.send(new PutBucketEncryptionCommand({
                Bucket: target,
                ServerSideEncryptionConfiguration: {
                  Rules: [{ ApplyServerSideEncryptionByDefault: { SSEAlgorithm: 'AES256' } }],
                },
              }));
              console.log(JSON.stringify({ encryption: 'AES256_applied' }));
            } catch (e) {
              console.log(JSON.stringify({ encryption: 'failed_or_default', error: e?.name || e?.message }));
            }

            const probeKey = `test/_phase_c_probe/${Date.now()}.txt`;
            const body = Buffer.from(`phase-c-probe ${new Date().toISOString()}`, 'utf8');
            try {
              await client.send(new PutObjectCommand({
                Bucket: target,
                Key: probeKey,
                Body: body,
                ContentType: 'text/plain',
              }));
              const got = await client.send(new GetObjectCommand({ Bucket: target, Key: probeKey }));
              const chunks = [];
              for await (const c of got.Body) chunks.push(c);
              const text = Buffer.concat(chunks).toString('utf8');
              await client.send(new DeleteObjectCommand({ Bucket: target, Key: probeKey }));
              console.log(JSON.stringify({
                putGetDeleteOk: true,
                bucket: target,
                keyPrefix: 'test/_phase_c_probe/',
                bytes: body.length,
                roundTripOk: text.startsWith('phase-c-probe'),
              }));
            } catch (e) {
              console.log(JSON.stringify({ putGetDeleteOk: false, error: e?.name || e?.message }));
              process.exit(5);
            }

            console.log(JSON.stringify({ crmPariskqWrites: 0 }));
            process.exit(0);
            NODE
              echo "===== S3 MODE COMPLETE ====="
              exit 0
            fi

            echo "Mutating modes not yet enabled in this commit (inspect-only gate). mode=$MODE"
            exit 3
